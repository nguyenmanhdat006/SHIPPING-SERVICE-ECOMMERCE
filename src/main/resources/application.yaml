server:
  port: ${SERVER_PORT:8088}

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: shipping-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://usw2.auth.ac/auth/realms/ecommerce}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:https://usw2.auth.ac/auth/realms/ecommerce/protocol/openid-connect/certs}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shipping_db}
    username: ${DB_USERNAME:nguyendat}
    password: ${DB_PASSWORD:nguyendat}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

shipping:
  default-weight: 1000
  default-length: 20
  default-width: 15
  default-height: 10

logging:
  level:
    root: INFO
    com.ecommerce: ${LOGGING_LEVEL_COM_ECOMMERCE:DEBUG}

